services:
  - type: web
    name: jbnmedia
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Pages with their own link-preview tags (written at build time by vite.config.js)
      - type: rewrite
        source: /work/goherbal
        destination: /work/goherbal/index.html
      - type: rewrite
        source: /partners
        destination: /partners/index.html
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /results
        destination: /results/index.html
      # Send every other clean URL (/pricing, /contact, ...) to the React app
      - type: rewrite
        source: /*
        destination: /index.html
