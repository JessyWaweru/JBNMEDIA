services:
  - type: web
    name: jbnmedia
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Send every clean URL (/pricing, /contact, ...) to the React app
      - type: rewrite
        source: /*
        destination: /index.html
